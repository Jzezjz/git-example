<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JZez · 自我介绍</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.12);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent2: #a78bfa;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
      color: var(--text);
      background: var(--bg);
      padding: 24px;
      overflow-x: hidden;
    }
    /* 动态渐变背景光斑 */
    .bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(circle at 15% 20%, rgba(56, 189, 248, 0.25), transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(167, 139, 250, 0.25), transparent 40%),
        radial-gradient(circle at 70% 20%, rgba(52, 211, 153, 0.15), transparent 35%);
      filter: blur(10px);
    }
    .card {
      width: 100%;
      max-width: 560px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 48px 40px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      animation: rise 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      font-weight: 700;
      color: #0f172a;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow: 0 8px 30px rgba(56, 189, 248, 0.35);
    }
    .name {
      text-align: center;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 6px;
    }
    .subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      letter-spacing: 1px;
      margin-bottom: 32px;
    }
    .info {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .row {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 16px 18px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      border-radius: 14px;
      transition: transform 0.25s ease, background 0.25s ease;
    }
    .row:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.08);
    }
    .icon { font-size: 22px; line-height: 1.3; }
    .label { font-size: 12px; color: var(--muted); letter-spacing: 1px; margin-bottom: 3px; }
    .value { font-size: 16px; font-weight: 500; }
    .tag {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 13px;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(167, 139, 250, 0.2));
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: #bae6fd;
    }
    .footer {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      margin-top: 28px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <main class="card">
    <div class="avatar">J</div>
    <h1 class="name">JZez</h1>
    <p class="subtitle">JZez · 具身智能探索者</p>

    <div class="info">
      <div class="row">
        <span class="icon">👤</span>
        <div>
          <div class="label">姓名 / NAME</div>
          <div class="value">JZez</div>
        </div>
      </div>

      <div class="row">
        <span class="icon">🎯</span>
        <div>
          <div class="label">研究方向 / FOCUS</div>
          <div class="value"><span class="tag">具身智能</span> Embodied AI</div>
        </div>
      </div>

      <div class="row">
        <span class="icon">🛠️</span>
        <div>
          <div class="label">正在学习 / LEARNING</div>
          <div class="value"><span class="tag">Git</span> 版本控制与协作</div>
        </div>
      </div>
    </div>

    <p class="footer">你好，我是JZez · 正在学习 Git · 方向是具身智能</p>
  </main>
</body>
</html>
